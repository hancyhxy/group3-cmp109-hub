assword formats acceptable", "answer": null}, {"kind": "error", "level": 1, "text": "Student does not exist", "answer": null}, {"kind": "menu", "level": 1, "text": "Student System (l/r/x): ", "answer": "x"}, {"kind": "menu", "level": 0, "text": "University System: (A)dmin, (S)tudent, or X : ", "answer": "X"}, {"kind": "info", "level": 0, "text": "Thank You", "answer": null}]], "verifies": ["students.data should be empty at the end"]}], "docs": {"start": "# Start here — Group 3 (Cmp1-09), Part 2\n\nAssessment 1 Part 2: CLIUniApp + GUIUniApp in Python. **Code deadline: Sat 24 Oct 23:59** · **Showcase: Wed 28 Oct** · Submission: Mon 26 Oct (deadline Sun 1 Nov 23:59: the PDF says Sunday of Week 13; Canvas shows 8 Nov).\nTeam Hub: https://hancyhxy.github.io/group3-cmp109-hub/ · Full rules: `CONTRIBUTING.md`\n\n## Who does what\n\nThe split follows the lecturer's suggestion in spec section 7 (a+b / c / d / e). Each person keeps the module they designed in Part 1, and every file has exactly one owner.\n\n| ID | Member | Rubric part (marks) | Your files | Branch | Your checks |\n| --- | --- | --- | --- | --- | --- |\n| m1 | B S. | a University System (4) + b Student System (9) + change password from c (2) = **15** | `controllers/university_controller.py`<br>`controllers/student_controller.py`<br>`services/auth_service.py`<br>`utils/validators.py` | `m1-auth` | `python tests/check.py m1` (6) |\n| m2 | Cheng-Han L. | c Subject Enrolment System without change password = **13** | `controllers/subject_controller.py`<br>`services/enrolment_service.py` | `m2-enrolment` | `python tests/check.py m2` (5) |\n| m3 | Yuchen C. | d Admin System = **15** | `controllers/admin_controller.py`<br>`services/admin_subsystem.py`<br>`models/database.py` | `m3-admin` | `python tests/check.py m3` (4) |\n| m4 | Xinyi H. | e GUIUniApp (7) + shared code + merging | `gui/` (4 windows) and the shared code | `m4-gui` | GUI checklist in `docs/tasks/m4.md` |\n\n## 1. What you get\n\nEverything below is already in the repo, so you can start straight away.\n\n| What | Where | What it does for you |\n| --- | --- | --- |\n| **Your task card** | `docs/tasks/<your-id>.md` (Hub → *My task*) | What to build, the traps to avoid, and your \"done\" checklist |\n| **Your files, ready to fill in** | Listed in your task card | The class and method names are fixed. Each method's description (docstring) says exactly what it must do and print. Until you write it, the method says \"not written yet\" (`NotImplementedError`) |\n| **Shared code** (already written, don't edit) | `models/student.py`, `models/subject.py`, `utils/console.py`, `utils/messages.py`, `main.py`, `gui_main.py` | Student and Subject data, grades, unique subject IDs, Sample I/O colours and indentation, wording for extra cases |\n| **Demo runner** | `python dev_run.py <part>` | Runs only your part with demo data, so you never wait for anyone else's code |\n| **Automatic checks** | `python tests/check.py <your-id>` | Compare your output with the Sample I/O line by line: TODO / PASS / FAIL |\n| **Sample I/O with console calls** | Hub → *Sample I/O*, or `docs/spec/sample-io.md` | Every line you must print, plus which `console` function and level to use |\n| **AI pack** | Hub → *My task* → *For your AI assistant*, or `docs/ai/<your-id>.md` | One file with everything your AI needs. Copy it, download it as MD or JSON, or share its public link |\n| **Notes template** | `docs/members/<your-id>.md` | Your contribution record and your Showcase notes |\n| **PR template + GitHub checks** | Appear automatically when you open a Pull Request | ✅ / ❌ on every push. They also check that you only changed your own files |\n\n## 2. How to use it\n\n1. **Send Xinyi your GitHub username**, accept the invite to `hancyhxy/group3-Cmp109`, then clone the repo (GitHub Desktop, or the commands below). On a Mac, type `python3` wherever this guide says `python`.\n2. **Create your branch** with your exact name: `m1-auth` / `m2-enrolment` / `m3-admin` / `m4-gui`.\n3. **Read your task card** (Hub → *My task*).\n4. **Run your part** with `python dev_run.py <part>`. At first it says \"not written yet\", which is expected.\n5. **Write the code in your own files only.** If you use AI, give it your AI pack.\n6. **Run your checks** (`python tests/check.py <your-id>`) and fix things until everything says PASS. A FAIL shows `expected` vs `got`.\n7. **Commit and push often** to your own branch, with a message like `[M2] enrol: refuse a 5th subject`. Never push to `main`: GitHub can't lock it on our plan.\n8. **Thu 22 Oct:** push at least one commit, then open a *Draft* Pull Request (GitHub can't open one for a branch with no changes). **Sat 24 Oct 23:59:** click *Ready for review*.\n\n```bash\ngit clone https://github.com/hancyhxy/group3-Cmp109.git\ncd group3-Cmp109\ngit checkout -b m2-enrolment\npython dev_run.py course\npython tests/check.py m2\ngit add -A\ngit commit -m \"[M2] enrol: refuse a 5th subject\"\ngit push -u origin m2-enrolment\n```\n\n| You are | `dev_run.py` part |\n| --- | --- |\n| m1 B | `student` (or `university`) |\n| m2 Cheng-Han | `course` |\n| m3 Yuchen | `admin` (or `admin --real-db`) |\n| m4 Xinyi | `gui` |\n\n## 3. What you hand in\n\n**One Pull Request from your branch into `main`.** Please don't send code over chat. By **Sat 24 Oct 23:59** it must have:\n\n| Item | Done when |\n| --- | --- |\n| **Your code** | Only your own files are changed (the GitHub ownership check is ✅) |\n| **Your checks** | `python tests/check.py <your-id>` shows all PASS (the GitHub check is ✅) |\n| **`docs/members/<your-id>.md`** | Filled in: files, functions, rubric lines covered, extras, demo steps, a 90-second walkthrough, likely questions |\n| **PR description** | The template is filled in and your check output is pasted |\n| **Understanding** | You can explain every function in your own words (the Showcase is individually marked) |\n\nFor m4 (GUI), the GUI checklist in `docs/tasks/m4.md` replaces the automatic checks.\n\n## 4. How we merge\n\n1. **Review:** when your PR is *Ready*, Xinyi checks that only your files changed, that the checks are ✅, that your part runs in `dev_run.py`, that the code follows the rules, and that your notes are filled in.\n2. **Changes needed:** she leaves a *Request changes* comment, and you push the fix to the **same branch** (the PR updates by itself). Nobody rewrites your code without asking you.\n3. **Sun 25 Oct, merge:** Xinyi merges in this order: B (m1) → Cheng-Han (m2) → Yuchen (m3) → GUI (m4), using *Create a merge commit* so your own commits stay in the history as proof of your contribution. Files never overlap, so there are no conflicts.\n4. **Whole-team test:** after all four are merged, `python tests/check.py --strict` runs the complete Sample I/O through `main.py` with a real `students.data`, plus the GUI checklist. Any bug goes back to its owner as a small PR.\n5. **Mon 26 Oct, comments and submit:** try the merged app (`git checkout main && git pull`, then `python main.py` and `python gui_main.py`) and send Xinyi any comments. She applies them, builds `group3-Cmp109.zip` (only the app, plus a README with everyone's contributions) and uploads it to Canvas. That's the version we demo.\n6. **Showcase plan (B):** B organises how we present together on **Wed 28 Oct**: the order, who demos what, and timing. Each person presents and explains their own code, so make sure you understand every function in your files.\n\nRunning late? Tell Xinyi early. The latest we can accept is Sun 25 Oct 12:00.\n\n## Why it's set up this way (Part 1 feedback)\n\n- **Same design as Part 1:** our marker said the separation of responsibilities was our strongest point, so the code uses the same classes: RegistrationService, AuthenticationService, EnrolmentService, AdminSubsystem, Database (our FileManager), SubjectFactory, GradeCalculator.\n- **\"Check the four-subject limit before creating a subject\":** this is now a rule, and a check tests it.\n- **\"Keep required behaviour separate from our own assumptions\":** extras must not change any Sample I/O output, and the README lists every assumption and every change from Part 1.\n- **\"Multiplicity should match the real object structure\":** each service is created once at start-up and shared.\n- **One change from Part 1:** admin grouping and PASS/FAIL use each student's *average* mark, because that's what the Sample I/O shows. This replaces our assumption A1.\n\n## Dates\n\n| When | What |\n| --- | --- |\n| Wed 21 Oct | Send your GitHub username, accept the invite, run `dev_run.py`, create your branch |\n| **Thu 22 Oct** | Draft Pull Request open (at least one commit; unfinished is fine) |\n| **Sat 24 Oct 23:59** | Code done: PR ready, all checks PASS, notes filled in |\n| Sun 25 Oct | Xinyi merges all PRs and tests the whole app |\n| Mon 26 Oct | Try the merged app and send Xinyi your comments. Xinyi applies them and submits the zip |\n| Mon 26 – Tue 27 Oct | B organises the Showcase plan: order, who demos what, timing |\n| **Wed 28 Oct** | Showcase in our lab. Everyone must attend in person |\n| Sun 1 Nov 23:59 | Latest possible Canvas submission (the PDF says Sunday of Week 13; Canvas shows 8 Nov). We submit on Mon 26 Oct |\n", "guide": "# How we work\n\nThis is the full guide. The short version is the Team Hub: **https://hancyhxy.github.io/group3-cmp109-hub/**, or open `docs/team-hub.html` in your browser.\nWho owns what: `docs/start-here.md`. Your personal task: `docs/tasks/`.\n\n## 1. Get started (once, about 15 minutes)\n\n1. **Accept the invite.** Send Xinyi your GitHub username. GitHub then emails you an invitation to `hancyhxy/group3-Cmp109`. Click *Accept*.\n2. **Check Python.** In a terminal, run `python --version` (on Windows you can also try `py --version`). You need 3.9 or newer. If it's missing, install it from python.org and tick *Add Python to PATH* on Windows. On a Mac, type `python3` here and in every command in this guide.\n3. **Get the code.** Either use GitHub Desktop (*File → Clone repository → group3-Cmp109*) or run the commands below.\n4. **Open the folder** in VS Code or PyCharm, and use the built-in terminal for all commands.\n5. **Create your branch.** Use exactly this name: `m1-auth` (B), `m2-enrolment` (Cheng-Han), `m3-admin` (Yuchen), `m4-gui` (Xinyi).\n6. **Run your part with demo data**, then run your checks. Everything says TODO until you write it.\n\n```bash\ngit clone https://github.com/hancyhxy/group3-Cmp109.git\ncd group3-Cmp109\ngit checkout -b m2-enrolment\npython dev_run.py course\npython tests/check.py m2\n```\n\n| You are | Try your part | Your checks |\n| --- | --- | --- |\n| B S. | `python dev_run.py student` or `python dev_run.py university` | `python tests/check.py m1` |\n| Cheng-Han L. | `python dev_run.py course` | `python tests/check.py m2` |\n| Yuchen C. | `python dev_run.py admin` | `python tests/check.py m3` |\n| Xinyi H. | `python dev_run.py gui` | GUI checklist in `docs/tasks/m4.md` |\n\nDemo accounts for `dev_run.py`: `john.smith@university.com` and `alen.jones@university.com`, both with password `Helloworld123`. Demo data lives in memory and resets each run, so you never need anyone else's code to try yours.\n\n## 2. Daily loop\n\n1. Write code in **your own files only** (listed in your task card).\n2. Try it by hand with `python dev_run.py <part>`.\n3. Run `python tests/check.py <m1|m2|m3>` and fix things until every check says PASS.\n4. Save your work to GitHub: commit with a tagged message such as `[M2] enrol: refuse a 5th subject`, then push. Push only to your own branch, never to `main`: GitHub can't lock `main` on our plan.\n\n```bash\ngit add -A\ngit commit -m \"[M2] enrol: refuse a 5th subject\"\ngit push -u origin m2-enrolment\n```\n\n## 3. Reading the check results\n\n| Result | Meaning | What to do |\n| --- | --- | --- |\n| **TODO** | That method still raises `NotImplementedError` | Write it |\n| **PASS** | Your output matches the Sample I/O exactly | Nothing |\n| **FAIL** | Something differs, or the program crashed | Read the `expected:` / `got:` lines |\n\nExample of a failure: the wording is one letter off.\n\n```\nFAIL  m2.remove   output differs from the Sample I/O at step 3.\n      ok:       ask      level 2  'Remove Subject by ID: '  <- '541'\n      expected: info     level 2  'Droping Subject-541'\n      got:      info     level 2  'Dropping Subject-541'\n```\n\n`expected` and `got` show three things: the console function (`info`), the level (indentation) and the text. Any of the three can be the difference.\n\n## 4. Coding rules\n\nThese rules make four people's code look like one program.\n\n**Rule 1: All output goes through `utils/console.py`.** Never call `print()` or `input()`; a check fails if you do.\n\n| Function | Use it for | Colour |\n| --- | --- | --- |\n| `console.menu(text, level)` | Menu prompts, e.g. `Admin System (c/g/p/r/s/x): ` | cyan |\n| `console.ask(text, level)` | Field prompts, e.g. `Email: ` | white |\n| `console.warn_ask(text, level)` | The clear-database (Y)ES/(N)O question | red |\n| `console.heading(text, level)` | `Student Sign Up`, `Student Sign In` | green |\n| `console.info(text, level)` | Progress and success messages | yellow |\n| `console.error(text, level)` | Errors and warnings | red |\n| `console.line(text, level)` | Data lines (subjects, students) | white |\n\n`level` is the indentation: `0` University menu, `1` Student and Admin menus (8 spaces), `2` Student Course Menu (16 spaces). The functions that ask (`menu`, `ask`, `warn_ask`) return what the user typed, without surrounding spaces.\n\n**Rule 2: Copy the Sample I/O word for word.** It's in `docs/spec/sample-io.md` and in the Team Hub's *Sample I/O* tab, which also shows which function and level to use for every line. Keep the original typo `Droping`. Each subsystem has 1 mark for matching I/O.\n\n**Rule 3: Cases the Sample I/O doesn't show use `utils/messages.py`.**\n\n| Constant | Text | When |\n| --- | --- | --- |\n| `INVALID_OPTION` | Invalid option - try again | Any menu, unknown choice |\n| `NAME_REQUIRED` | Name cannot be empty | Register, empty name (ask again) |\n| `INCORRECT_PASSWORD_FORMAT` | Incorrect password format | Change password, bad new password (ask again) |\n| `SUBJECT_NOT_FOUND` | Subject {subject_id} does not exist | Remove subject, unknown ID |\n\n**Rule 4: Services don't print; controllers don't touch the file.** Services (`services/`) hold the rules and read/write data through `self.database.load_students()` and `self.database.save_students(students)`. Controllers (`controllers/`) ask, call a service, and show the result.\n\n**Rule 5: Don't rename existing classes, methods or parameters.** Other parts and the checks call them. Adding your own helper methods is fine.\n\n**Rule 6: IDs are strings with leading zeros.** Students use 6 digits (`\"002340\"`), subjects 3 digits (`\"097\"`).\n\n**Rule 7: Names and docstrings.** Use `snake_case` for functions and variables and `PascalCase` for classes (Part 1's `enrolSubject()` becomes `enrol_subject()`). Give every method a one-line English docstring.\n\n**Rule 8: Never crash on bad input** (wrong option, empty input, unknown ID). Each subsystem has 2 marks for error handling.\n\n**Rule 9: Extras must not change any Sample I/O output.** List any extra behaviour in your `docs/members/<id>.md`.\n\n## 5. Files you must not change\n\n`models/student.py`, `models/subject.py`, `utils/console.py`, `utils/messages.py`, `main.py`, `gui_main.py`, `dev_run.py`, `tests/`, `tools/`, `.github/`, `docs/` (except your own `docs/members/<id>.md`), and anyone else's files.\n\nIf you need a change there, ask in the group chat and Xinyi will make it. Every Pull Request runs an ownership check that fails if a branch changes a file its owner doesn't own. Never commit `students.data` (Git ignores it already).\n\n## 6. Pull Request (how you hand in)\n\n1. **By Thu 22 Oct:** push at least one commit to your branch (GitHub can't open a Pull Request for a branch with no changes), then open a **Draft** Pull Request into `main`. On GitHub: *Pull requests → New pull request → compare: your branch → Create draft pull request*. It's fine if it isn't finished yet.\n2. **By Sat 24 Oct 23:59:** all your checks PASS, `docs/members/<your-id>.md` is filled in, and the PR description (the template appears automatically) is complete. Click **Ready for review**.\n3. GitHub runs the checks on every push. ✅ means fine. ❌ means click *Details* to see the same messages as `tests/check.py`.\n4. Xinyi reviews and merges in the order B → Cheng-Han → Yuchen → GUI. If she asks for changes, push more commits to the **same** branch. The PR updates by itself.\n\n## 7. Using AI\n\nThe PDF says \"Do NOT use AI-generated code\", but the lecturer said in class that AI assistance is fine as long as you understand your code. Marks are individual, though, and in the Showcase you present and explain your own code.\n\n1. Give the AI your **AI pack**. It's one file with the instructions and rules, your task, your files, the shared code it may call, and every expected screen line written as the exact `console` call. Get it from the Team Hub (*My task → For your AI assistant*: Copy, Download as MD or as JSON), or from `docs/ai/<your-id>.md` in the repo. AI assistants can't open our private repo, so upload or paste the file, or give an AI that can browse your public pack link: `https://hancyhxy.github.io/group3-cmp109-hub/ai/<your-id>.md`. The public pack shows code as interfaces only. Coding with Copilot or Cursor inside the repo? Point it at `docs/ai/...md`.\n2. Run your checks. If something FAILs, paste the `expected:` / `got:` lines back to the AI.\n3. The pack in the repo is a snapshot. To rebuild it from your own branch, run `python tools/build_hub.py --open`; it writes to `dist/`, which is never committed.\n4. Before you click *Ready for review*, make sure you can explain every function in your own words.\n\n## 8. Common questions\n\n**A check says TODO but I wrote the code.** Another method in your files still contains `raise NotImplementedError(...)`. Search your files for it.\n\n**Colours show up as strange symbols on Windows.** Use the terminal inside VS Code or PyCharm, or Windows Terminal. The checks don't depend on colours.\n\n**`students.data` gives an error after an update.** Delete `students.data`; it's recreated automatically. It only holds test data.\n\n**I need a helper function that someone else also needs.** Ask in the group chat. Shared helpers go in a foundation file, which Xinyi adds.\n\n**I disagree with a rule or the Sample I/O looks wrong.** Say so in the group chat before changing anything, so all four parts stay consistent.\n\n**I'm going to be late.** Tell Xinyi as early as possible. The Draft PR on Thu 22 Oct exists so problems show up early.\n"}, "prs": [{"headRefName": "m1-auth", "isDraft": false, "number": 5, "state": "MERGED", "title": "M1: Student Registration and Authentication", "updatedAt": "2026-10-25T23:37:46Z", "url": "https://github.com/hancyhxy/group3-Cmp109/pull/5"}, {"headRefName": "m2-enrolment", "isDraft": false, "number": 4, "state": "MERGED", "title": "[M2] enrolment service, course menu and member notes", "updatedAt": "2026-10-25T23:38:03Z", "url": "https://github.com/hancyhxy/group3-Cmp109/pull/4"}, {"headRefName": "m4-gui", "isDraft": false, "number": 3, "state": "MERGED", "title": "M4: GUIUniApp (login, enrolment, subject and exception windows)", "updatedAt": "2026-10-26T01:24:21Z", "url": "https://github.com/hancyhxy/group3-Cmp109/pull/3"}, {"headRefName": "m3-admin", "isDraft": false, "number": 2, "state": "MERGED", "title": "M3: Implement Admin System and Student Storage", "updatedAt": "2026-10-26T01:24:03Z", "url": "https://github.com/hancyhxy/group3-Cmp109/pull/2"}], "repo": "https://github.com/hancyhxy/group3-Cmp109", "publicUrl": "https://hancyhxy.github.io/group3-cmp109-hub", "edition": "public"};

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get: (k, d) => { try { const v = localStorage.getItem("hub." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },

function copyButton(getText) {
  const b = document.createElement("button");
  b.className = "copy"; b.textContent = "Copy";
  b.onclick = () => {
    const done = () => { b.textContent = "Copied"; b.classList.add("done"); setTimeout(() => { b.textContent = "Copy"; b.classList.remove("done"); }, 1400); };
    const text = getText();
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done);
    else { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); }
  };
  return b;
}
const badge = s => `<span class="badge ${s}">${s}</span>`;
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function flash(btn, text) { const old = btn.textContent; btn.textContent = text; setTimeout(() => btn.textContent = old, 1400); }
function copyText(text, btn) {
  const done = () => flash(btn, "Copied \u2713");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done);
  else { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); done(); }
}

/* ---------------- tiny markdown renderer (for our docs) ---------------- */
function inline(text) {
  const codes = [];
  let s = text.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s).replace(/&lt;br&gt;/g, "<br>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function renderMarkdown(md, scope) {
  const lines = md.replace(/<!--[\s\S]*?-->/g, "").split("\n");
  let html = "", i = 0, box = 0;
  const isBlockStart = l => /^(#{1,4}\s|```|\||>|\s*([-*]|\d+\.)\s)/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; html += `<pre data-copy><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { const n = h[1].length; html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if (line.startsWith("|") && i + 1 < lines.length && /^\|\s*:?-/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      html += "<table><thead><tr>" + cells(line).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && lines[i].startsWith("|")) { html += "<tr>" + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>"; i++; }
      html += "</tbody></table>"; continue;
    }
    if (line.startsWith(">")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
      html += `<blockquote data-copy>${inline(buf.join(" "))}</blockquote>`; continue;
    }
    const li = line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const ordered = /\d/.test(li[1]); const tag = ordered ? "ol" : "ul"; let items = "";
      while (i < lines.length) {
        const m = lines[i].match(/^\s*([-*]|\d+\.)\s+(.*)$/);
        if (!m || /\d/.test(m[1]) !== ordered) break;
        let text = m[2]; i++;
        while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) text += " " + lines[i++].trim();
        const task = text.match(/^\[( |x)\]\s+(.*)$/i);
        if (task) {
          const key = `${scope}.box${box++}`;
          items += `<li class="task"><label><input type="checkbox" data-key="${key}"${store.get(key, task[1] !== " ") ? " checked" : ""}>${inline(task[2])}</label></li>`;
        } else items += `<li>${inline(text)}</li>`;
      }
      html += `<${tag}>${items}</${tag}>`; continue;
    }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) buf.push(lines[i++]);
    html += `<p>${buf.map(inline).join("<br>")}</p>`;
  }
  return html;
}
function enhance(root) {
  root.querySelectorAll("[data-copy]").forEach(el => { if (!el.querySelector(".copy")) el.appendChild(copyButton(() => el.innerText.replace(/Copy$/, "").trim())); });
  root.querySelectorAll("input[data-key]").forEach(box => box.onchange = () => store.set(box.dataset.key, box.checked));
}

    </div><div class="small muted" style="margin-top:8px">Direct links: <code>team-hub.html#task/m1</code> … <code>#task/m4</code>, <code>#sample/m2</code>, <code>#guide</code>. Each person's AI pack is under <b>My task</b>, or at <code>/ai/m1.md</code> … <code>/ai/m4.md</code>.</div></div>`;
  $("#start").innerHTML = renderMarkdown(HUB.docs.start.replace(/^# .*\n/, ""), "start");
  $("#o-pdf").onclick = () => window.print();
  $("#o-json").onclick = () => download("team-hub-data.json", JSON.stringify(HUB, null, 2), "application/json");
  enhance(el); tick();
}
function fmtDate(iso) { return new Date(iso).toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function tick() {
  const now = Date.now(); const { list, next } = milestoneState(now);
  const tl = $("#timeline"); if (!tl) return;
  tl.innerHTML = list.map(m => {
    const cls = m.t <= now ? "past" : (next && m.t === next.t ? "now" : "");
    return `<li class="${cls}"><span class="when">${esc(m.label)}</span><span><b>${esc(m.title)}</b> — ${esc(m.what)} <span class="who">· ${esc(m.who)}</span></span></li>`;
  }).join("");
  const box = $("#next");
  if (!next) { box.innerHTML = `<div class="label">All milestones done</div><div class="title">Well done, team 🎉</div>`; return; }
  let d = Math.max(0, next.t - now); const days = Math.floor(d / 864e5); d -= days * 864e5;
  const hrs = Math.floor(d / 36e5); d -= hrs * 36e5; const mins = Math.floor(d / 6e4); const secs = Math.floor((d - mins * 6e4) / 1e3);
  box.innerHTML = `<div class="label">Next milestone</div><div class="title">${esc(next.title)}</div>
    <div>${esc(next.what)}</div><div class="muted small">${esc(next.label)} · ${esc(next.who)}</div>
    <div class="clock"><div><b>${days}</b><span>days</span></div><div><b>${String(hrs).padStart(2, "0")}</b><span>hours</span></div><div><b>${String(mins).padStart(2, "0")}</b><span>min</span></div><div><b>${String(secs).padStart(2, "0")}</b><span>sec</span></div></div>`;
}

/* ---------------- sample I/O ---------------- */
const PH = {
  ID: ["541", "random subject ID, printed WITHOUT leading zeros (e.g. 97)"],
  ID3: ["541", "random 3-digit subject ID WITH leading zeros (e.g. 097)"],
  SID: ["762740", "random 6-digit student ID"],
  MARK: ["55", "random mark 25-100"],
  GRADE: ["  P", "grade right-aligned in 3 characters: '  P', ' HD'"],
  AVG: ["63.50", "average mark, 2 decimals"],
};
const EXAMPLES = { ID: ["541", "455", "742", "97"], ID3: ["541", "455", "742", "097"], MARK: ["55", "57", "55", "85"], GRADE: ["  P", "  P", "  P", " HD"], SID: ["673358", "762740"], AVG: ["68.25", "63.50"] };
let phCount = {};
function showText(text) {
  return esc(text).replace(/\{(ID3|ID|SID|MARK|GRADE|AVG)(?::\w+)?\}/g, (_, k) => {
    const list = EXAMPLES[k]; const n = phCount[k] = (phCount[k] || 0) + 1;
    return `<span class="ph" title="${esc(PH[k][1])}">${esc(list[(n - 1) % list.length])}</span>`;
  });
}
function renderSample(filter) {
  filter = filter || store.get("sampleFilter", "all"); store.set("sampleFilter", filter);
  const calls = store.get("showCalls", true);
  const groups = [["all", "All"], ["m1", "B"], ["m2", "Cheng-Han"], ["m3", "Yuchen"], ["e2e", "Whole run"]];
  const pills = groups.map(([k, l]) => `<button data-f="${k}" class="${k === filter ? "on" : ""}">${l}</button>`).join("");
  const list = HUB.scenarios.filter(s => s.owner !== "foundation" && (filter === "all" || s.owner === filter));
  const body = list.map(s => {
    phCount = {};
    const blocks = s.blocks.length ? s.blocks.map((lines, n) => `${s.blocks.length > 1 ? `<div class="small muted">${s.owner === "e2e" ? "Program run" : "Part"} ${n + 1}</div>` : ""}<div class="term${calls ? " calls" : ""}">${lines.map(l => {
      if (l.comment) return `<div class="cm"># ${esc(l.comment)}</div>`;
      const gut = `console.${l.kind}${l.level ? " · L" + l.level : ""}`;
      const ans = l.answer === null ? "" : `<span class="ans">${l.answer.startsWith("$") ? `<span class="ph" title="the ID shown earlier">${l.answer === "$alen" ? "762740" : "541"}</span>` : esc(l.answer)}</span>`;
      return `<div class="ln"><span class="gut">${gut}</span><span class="k-${l.kind}">${" ".repeat(8 * l.level)}${showText(l.text)}</span>${ans}</div>`;
    }).join("")}</div>`).join("") : `<div class="logic">Logic check: no screen output. It calls your methods directly and checks the result (see the title).</div>`;
    return `<div class="scn"><div class="scn-head"><b>${esc(s.title)}</b><span class="who">${badge(s.status)} <code>python tests/check.py ${esc(s.owner)}</code> · ${esc(s.ownerName)}</span></div>${blocks}</div>`;
  }).join("");
  $("#tab-sample").innerHTML = `
    <div class="note">These are the exact scripts the automatic checks use, copied from the official Sample I/O. Typed input is <b style="color:#000">bold</b>; dotted values are random (hover to see the rule). Turn on <b>Show console calls</b> to see which <code>utils.console</code> function and level each line needs.</div>
    <div class="toolbar"><div class="pills" style="margin:0">${pills}</div>
      <label><input type="checkbox" id="calls"${calls ? " checked" : ""}> Show console calls</label>
      <span class="dl"><button class="btn" id="s-md">Download as MD</button><button class="btn" id="s-json">Download as JSON</button><button class="btn" id="s-pdf">Save as PDF</button></span></div>
    <div class="legend"><span class="k-menu">menu()</span><span class="k-ask">ask()</span><span class="k-warn_ask">warn_ask()</span><span class="k-heading">heading()</span><span class="k-info">info()</span><span class="k-error">error()</span><span class="k-line">line()</span></div>
    ${body}`;
  $("#tab-sample").querySelectorAll(".pills button").forEach(b => b.onclick = () => { location.hash = "sample/" + b.dataset.f; });
  $("#calls").onchange = e => { store.set("showCalls", e.target.checked); document.querySelectorAll(".term").forEach(t => t.classList.toggle("calls", e.target.checked)); };
  const label = filter === "all" ? "all" : filter;
  $("#s-md").onclick = () => download(`sample-io-${label}.md`, [
    `# Sample I/O as utils.console calls (${label})`, "",
    "Each screen line is the exact call that must produce it, in order. Placeholders: {ID} subject ID without leading zeros, {ID3} 3-digit subject ID, {SID} 6-digit student ID, {MARK} 25-100, {GRADE} right-aligned in 3 characters, {AVG} 2 decimals.", "",
    ...list.flatMap(s => [`## ${s.owner}.${s.name}: ${s.title}`, "",
      ...(s.blocks.length ? s.blocks.flatMap(b => ["```python", ...b.map(asCall), "```", ""]) : ["No screen output: logic check.", ""]),
      ...(s.verifies.length ? ["Also verifies:", ...s.verifies.map(v => "- " + v), ""] : [])]),
  ].join("\n"), "text/markdown");
  $("#s-json").onclick = () => download(`sample-io-${label}.json`, JSON.stringify(list.map(s => ({
    id: `${s.owner}.${s.name}`, title: s.title, verifies: s.verifies,
    screens: s.blocks.map(b => b.map(l => l.comment ? l : { function: "console." + l.kind, level: l.level, text: l.text, user_types: l.answer }))
  })), null, 2), "application/json");
  $("#s-pdf").onclick = () => window.print();
}

/* ---------------- routing ---------------- */
function route() {
  const [tab, arg] = (location.hash.replace("#", "") || "overview").split("/");
  const name = ["overview", "task", "sample", "guide"].includes(tab) ? tab : "overview";
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("on", s.id === "tab-" + name));
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === name));
  if (name === "overview") renderOverview();
  if (name === "task") renderTask(arg);
  if (name === "sample") renderSample(arg);
  if (name === "guide") renderGuide();
  window.scrollTo(0, 0);
}
$("#nav").querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); const t = a.dataset.tab; location.hash = t === "task" ? "task/" + store.get("member", "m1") : t === "sample" ? "sample/" + store.get("sampleFilter", "all") : t; });
$("#foot").innerHTML = `${HUB.edition === "public" ? "Public edition (code shown as interfaces only) · " : "Team copy · "}Public link: <a href="${esc(HUB.publicUrl)}/" target="_blank">${esc(HUB.publicUrl.replace("https://", ""))}</a> · Generated ${esc(fmtDate(HUB.generated))} from <code>${esc(HUB.git.branch || "?")}</code> @ <code>${esc(HUB.git.commit || "?")}</code> · Repo: <a href="${esc(HUB.repo)}" target="_blank">${esc(HUB.repo.replace("https://", ""))}</a> · Refresh with <code>python tools/build_hub.py --open</code> (your local status) · Countdown runs live in your browser.`;
window.addEventListener("hashchange", route);
setInterval(tick, 1000);
route();
</script>
